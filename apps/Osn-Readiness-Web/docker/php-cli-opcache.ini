; Docker Sail di Windows: bind-mount . ke container terjadi lewat WSL2/virtiofs yang
; jauh lebih lambat daripada filesystem Linux asli. Tanpa OPcache, PHP meng-compile
; ulang semua file pada setiap request (baseline ~230ms, seharusnya ~20ms), dan
; revalidate timestamp yang periodik memicu stall ~2 detik.
;
; validate_timestamps=0 dipilih karena:
;   - file di dalam image container (vendor/) tidak pernah berubah, jadi tidak
;     perlu divalidasi sama sekali;
;   - satu-satunya file yang berubah saat dev adalah file aplikasi, dan untuk
;     memuat perubahan itu cukup restart container (docker compose restart).
; Kalau lebih suka hot-reload, ubah ke 1 dan revalidate_freq ke 60.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
